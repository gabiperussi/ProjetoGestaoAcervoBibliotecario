<!DOCTYPE html>
<html lang="pt-BR"> <head>
    <meta charset="UTF-8">
    <title>Sistema de Gestão de Biblioteca</title>
</head>
<body>
    <h1>Faça o login</h1>
    <form id="FormLogin"> 
        <div class="formContainer">
            <input type="email" placeholder="E-mail" id="email" required>
            <br> <br>
            <input type="password" placeholder="Senha" id="senha" required>
            <br> <br>
            <button type="submit">Entrar</button>
        </div>
    </form>
    <div id="mensagem"></div> 

    <script>
        const API_BASE = "http://localhost/ProjetoGestaoAcervoBibliotecario/api_livros";

        function getFormData() {
            return { 
                email: document.getElementById('email').value,
                senha: document.getElementById('senha').value 
            }; 
        } 
        
        async function Login(User) {
    try {
        const resposta = await fetch(`${API_BASE}/login`, {
            method: 'POST',
            headers: {
                "Content-Type": 'application/json'
            },
            body: JSON.stringify(User) 
        });

        // Captura o texto bruto primeiro para evitar o crash do JSON inválido
        const textoResposta = await resposta.text();
        let dados = {};

        try {
            // Tenta converter para objeto se for um JSON válido
            dados = JSON.parse(textoResposta);
        } catch (e) {
            // Se falhar, significa que o PHP cuspiu um erro HTML na tela
            console.error("O PHP retornou HTML em vez de JSON. Resposta do servidor:\n", textoResposta);
            throw new Error("O servidor respondeu com um erro interno formatado em HTML. Verifique o console.");
        }

        if (!resposta.ok) {
            console.log("Erro na requisição:", resposta);
            throw new Error(dados.error || dados.detalhe || `Erro HTTP: ${resposta.status}`);
        }

        return dados; 
    } catch (error) {
        console.error("Falha no processo de login:", error);
        throw error; 
    }
}

        async function handleFormSubmit(event) {
            event.preventDefault(); 
            
            const msg = document.getElementById('mensagem');
            const user = getFormData();

            console.log("Tentando login com:", user);

            try {
                
                const resultado = await Login(user);
                
                console.log("Resultado da API:", resultado);

                if (resultado) {
                    
                    sessionStorage.setItem('usuario', JSON.stringify(resultado));
                    window.location.href = "principal.html"; 
                }
            } catch (error) {
                msg.textContent = `Erro: ${error.message}`;
                msg.style.color = "red";
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById('FormLogin').addEventListener('submit', handleFormSubmit);
        });
    </script>
</body>
</html>
