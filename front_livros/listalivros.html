<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista livros</title>
    <style>
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
    </style>
</head>  
<body>
    <h1> PROJETO ACERVO BIBLIOTECA </h1>
    <hr>
    <h2> Lista livros </h2>
    <h3> MENU </h3>
    <div>
        <a href="principal.html"><button> Menu Inicial </button></a>
        <a href="cadastro.html"><button> Cadastrar livros </button></a>
    </div>

    <div>
        <table id="tabela">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Título</th>
                    <th>Descrição</th>
                    <th>Autor</th>
                    <th>Estoque</th>
                    <th>Editar</th>
                    <th>Excluir</th>
                </tr>
            </thead>    
            <tbody>
                </tbody>   
        </table>
    </div>

    <script>
        const API_BASE = "http://localhost/ProjetoGestaoAcervoBibliotecario/api_livros";

        async function buscarDadosTabela(){
            try {
                const resposta = await fetch(`${API_BASE}/livro`);

                
                if (!resposta.ok) {
                    const erroData = await resposta.json();
                    throw new Error(erroData.error || `Erro HTTP: ${resposta.status}`);
                }

                const dados = await resposta.json();
                
                
                return dados.dados || dados;

            } catch (erro) {
                console.error("Erro ao buscar livros:", erro);
                return [];
            }
        }

        async function preencherTabela(dados) {
            const tabelaCorpo = document.querySelector('#tabela tbody');
            
           
            tabelaCorpo.innerHTML = ""; 

            if (!dados || dados.length === 0){
                const tr = document.createElement('tr');
                const td = document.createElement('td');
                td.colSpan = 7; 
                td.textContent = "Nenhum Livro cadastrado.";
                tr.appendChild(td);
                tabelaCorpo.appendChild(tr);
                return;
            }

            dados.forEach(livro => {
                const tr = document.createElement('tr');

                //Célula ID
                const tdID = document.createElement('td');
                tdID.textContent = livro.id_livro;
                tr.appendChild(tdID);

                //Célula Título
                const tdTitulo = document.createElement('td');
                tdTitulo.textContent = livro.titulo;
                tr.appendChild(tdTitulo);

                //Célula Descrição
                const tdDesc = document.createElement('td');
                tdDesc.textContent = livro.descricao || "Sem descrição";
                tr.appendChild(tdDesc);

                //Célula Autor
                const tdAutor = document.createElement('td');
                tdAutor.textContent = livro.autor;
                tr.appendChild(tdAutor);

                //Célula Estoque
                const tdEstoque = document.createElement('td');
                tdEstoque.textContent = livro.estoque || "0";
                tr.appendChild(tdEstoque);

                //Botão Editar
                const tdEditar = document.createElement('td');
                tdEditar.innerHTML = `<button onclick="editarLivro(${livro.id_livro})">Editar</button>`;
                tr.appendChild(tdEditar);

               //Botão Excluir
                const tdExcluir = document.createElement('td');
                tdExcluir.innerHTML = `<button onclick="excluirLivro(${livro.id_livro})">Excluir</button>`;
                tr.appendChild(tdExcluir);

                tabelaCorpo.appendChild(tr);
            });
        }

        
        function editarLivro(id) { alert('Editar livro: ' + id); }
        function excluirLivro(id) { alert('Excluir livro: ' + id); }

        document.addEventListener("DOMContentLoaded", async () => {
            const dados = await buscarDadosTabela();
            preencherTabela(dados);
        });
    </script>
</body>
</html>
